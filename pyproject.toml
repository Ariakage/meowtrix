[project]
name = "meowtrix"
version = "0.1.0"
description = "Meowtrix-0.8B: recurrent-depth latent reasoning, thinking-aware abliteration, and catgirl-persona post-training on Qwen3.5-0.8B."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "meowtrix contributors" },
]
keywords = ["llm", "recurrent-depth", "latent-reasoning", "post-training", "qwen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # NOTE: Qwen3.5 hybrid (Gated DeltaNet + GQA) support may require a newer
    # transformers release than the floor below. Bump when the checkpoint lands.
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "trl>=0.19.0",
    "datasets>=3.0.0",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.26.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meowtrix"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# Reproducible envs via `uv sync`; lockfile is committed on purpose.
package = true
