# Stage 2 — Colab variant of train_persona.yaml.
# bf16 end-to-end: torch>=2.14 optimizers own AMP unscaling and reject
# fp16-grad unscale on fp16/bf16-param mixes; bf16 needs no GradScaler.

stage: persona

model:
  model_path: Qwen/Qwen3.5-0.8B
  wrap_recurrent: true
  num_loops: 3
  torch_dtype: bfloat16
  metal_kernels: true     # no-op on CUDA

data:
  train_file: data/processed/stage2_mix.jsonl
  max_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  modules_to_save: [loop_gates]

trainer:
  output_dir: outputs/stage2-persona
  num_train_epochs: 3
  per_device_train_batch_size: 2   # T4 uses only ~3GB at bs=1; bs2 ~6GB
  gradient_accumulation_steps: 8   # same effective batch (2x8=16)
  learning_rate: 8.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 20
  logging_steps: 10
  save_strategy: steps
  save_steps: 50
  save_total_limit: 4
  save_epoch_checkpoints: true
  bf16: true
  fp16: false
  gradient_checkpointing: true
  group_by_length: true   # pair similar lengths → minimal padding waste
  assistant_only_loss: true
  seed: 42
